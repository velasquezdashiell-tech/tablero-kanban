# Docker Compose describe los servicios del proyecto. Comandos más usados:
#
#   docker compose up -d                       levanta solo PostgreSQL (lo normal al programar)
#   docker compose --profile tools up -d       PostgreSQL + Adminer (ver la base en http://localhost:8080)
#   docker compose --profile full up --build   PostgreSQL + la aplicación completa (http://localhost:3000)
#   docker compose ps                          qué está corriendo
#   docker compose logs -f db                  ver los registros de la base
#   docker compose down                        apaga todo (tus datos se conservan)
#   docker compose down -v                     apaga todo y BORRA los datos
#
# El tutorial completo está en el repositorio del curso: tutoriales/04-docker.md

name: tablero-kanban

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # puerto-en-tu-computador:puerto-dentro-del-contenedor
      # Usamos 5433 afuera para no chocar con un PostgreSQL que ya tengas instalado.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      - db

  app:
    build: .
    profiles: ["full"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
